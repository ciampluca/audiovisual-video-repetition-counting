[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-repetition-benchmark"
version = "0.1.0"
description = "Zero-shot video repetition counting with video-capable LVLMs served by vLLM"
requires-python = ">=3.10"
dependencies = [
    "hydra-core>=1.3,<2",
    "openai>=1.0",
    "tqdm>=4.66",
]

[project.scripts]
video-repetition-benchmark = "lvlm_video_repetition_benchmark.cli:main"

[project.optional-dependencies]
notebook = [
    "ipython>=8",
    "jinja2>=3.1",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lvlm_video_repetition_benchmark = []