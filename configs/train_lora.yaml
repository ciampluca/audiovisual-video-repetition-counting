defaults:
  - dataset: countix
  - model: qwen3_vl_8b
  - prompt: count_repetitions
  - _self_

paths:
  workspace_root: ${hydra:runtime.cwd}
  output_dir: ${paths.workspace_root}/adapters/${model.slug}-countix-lora

data:
  split: train
  validation_split: val
  sampling_fps: 10.0
  max_frames: 3000
  max_train_samples: null

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: '^model\.language_model\.layers\.[0-9]+\.self_attn\.(q_proj|k_proj|v_proj|o_proj)$'

training:
  response_fields: [count]
  seed: 42
  epochs: 3
  max_steps: -1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  weight_decay: 0.0
  warmup_ratio: 0.03
  logging_steps: 10
  save_total_limit: 2
  bf16: true
  gradient_checkpointing: true
  load_in_4bit: true
  quant_type: nf4
  double_quant: true
  resume_from_checkpoint: null

validation:
  max_new_tokens: 128

hydra:
  run:
    dir: ${paths.workspace_root}/.hydra_runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false