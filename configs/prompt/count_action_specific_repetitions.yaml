name: Count Action-Specific Repetitions # Display name recorded in results.
slug: count-action-specific-repetitions # Stable prompt identifier used in result paths.
# Asks the model to define one complete repetition for the action it observes.
text: >-
  Watch the full video and identify the main repeated action. Determine what
  counts as one repetition for that specific action, then apply that definition
  consistently throughout the clip. Count the repetitions visible in the video;
  do not count unrelated movements or infer repetitions that are not shown.